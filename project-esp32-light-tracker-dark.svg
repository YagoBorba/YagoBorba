<title id="title">ESP32 Light Tracker — Embedded · IoT</title>
<desc id="desc">Dual-axis solar tracker: an ESP32 reads four LDR sensors and drives two servos, with Bluetooth manual control, automatic calibration and real-time telemetry. Built with C++, ESP32, PlatformIO, Bluetooth. Status: stable.</desc>
