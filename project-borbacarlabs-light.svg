<title id="title">BorbaCar Labs — Android · OBD-II</title>
<desc id="desc">Android OBD-II diagnostic app in Java. Reads ELM327 adapters over Bluetooth, BLE or Wi-Fi, explains trouble codes in plain language and exports traceable PDF reports with optional AI analysis. Built with Java 17, Android, Node.js, OBD-II. Status: active.</desc>
